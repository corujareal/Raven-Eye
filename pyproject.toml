[tool.poetry]
name = "raveneye"
version = "6.6.6"
description = "RavenEye — I see you. Async security reconnaissance platform."
authors = ["RavenEye Team"]
packages = [{include = "raveneye"}, {include = "raveneye_pkg"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
requests = ">=2.32,<3"
PySocks = ">=1.7,<2"
aiohttp = ">=3.10,<4"
httpx = ">=0.27,<1"
pydantic = ">=2.7,<3"
pydantic-settings = ">=2.2,<3"
PyYAML = ">=6.0,<7"
rich = ">=13.7,<15"
colorama = ">=0.4,<1"
click = ">=8.1,<9"
beautifulsoup4 = ">=4.12,<5"
lxml = ">=5.2,<7"
aiosqlite = ">=0.20,<1"
sqlalchemy = ">=2.0,<3"
playwright = {version = ">=1.45,<2", optional = true}
python-dotenv = ">=1.0,<2"
dnspython = ">=2.6,<3"
python-whois = ">=0.9,<1"
PyJWT = ">=2.8,<3"
jsbeautifier = ">=1.15,<2"
tqdm = ">=4.66,<5"
reportlab = ">=4.0,<5"
Pillow = ">=10,<13"
uvloop = ">=0.19,<1; sys_platform == 'linux'"

[tool.poetry.extras]
headless = ["playwright"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
pytest-asyncio = ">=0.23,<2"
coverage = ">=7,<8"
testcontainers = ">=4,<5"

[tool.poetry.plugins."raveneye.plugins"]
example = "raveneye.plugins:PluginLoader"

[tool.poetry.scripts]
raveneye = "raveneye.cli.main:main"
raveneye-crawler = "raveneye.cli.main:crawler"
raveneye-scan = "raveneye.cli.main:scan"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
